name: test

# Run the tests when code is pushed to `main`, on PRs, or manually
on:
  push:
    branches: [ main ]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - name: Run the build
        run: mvn -B clean verify
        shell: bash
      - name: Archive Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: build/surefire-reports
          retention-days: 1

  # Smoke load tests: short duration, limited matrix so CI stays fast.
  # Full benchmarks remain a local/manual concern via load-tests/run-benchmarks.sh.
  load-tests:
    name: load-tests (smoke)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Install benchmark tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wrk jq

      - name: Install java-http to local Maven repo
        run: mvn -B -q install -DskipTests

      - name: Run load-test smoke benchmarks
        run: |
          chmod +x load-tests/run-benchmarks.sh
          # Keep CI fast: self + jdk only, hello scenario, 5s duration.
          # Tomcat/Netty/Jetty remain available for local full runs.
          SHA_SHORT="${GITHUB_SHA:0:7}"
          ./load-tests/run-benchmarks.sh \
            --servers self,jdk-httpserver \
            --scenarios hello \
            --tool wrk \
            --duration 5s \
            --label "ci-smoke-${SHA_SHORT}"

      - name: Upload load-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-tests/results/
          retention-days: 7
          if-no-files-found: ignore
