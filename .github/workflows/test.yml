name: test

# Run the tests when code is pushed to `main`, on PRs, or manually
on:
  push:
    branches: [ main ]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Explicit cache keyed on *all* POMs (library + load-test modules). setup-java's
      # built-in cache only hashes the root pom.xml by default, so we manage it here.
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run the build
        run: mvn -B --no-transfer-progress clean verify
        shell: bash

      # Hand the packaged library to the load-tests job so it can skip a full reinstall.
      - name: Upload library JAR for load-tests
        uses: actions/upload-artifact@v4
        with:
          name: java-http-jar
          path: |
            build/java-http-*.jar
            !build/java-http-*-sources.jar
            !build/java-http-*-javadoc.jar
          retention-days: 1
          if-no-files-found: error

      - name: Archive Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: build/surefire-reports
          retention-days: 1

  # Smoke load tests: short duration, limited matrix so CI stays fast.
  # Full benchmarks remain a local/manual concern via load-tests/run-benchmarks.sh.
  load-tests:
    name: load-tests (smoke)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install benchmark tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wrk jq

      # Install the JAR produced by the test job into the local Maven repo so the self
      # load-test module resolves io.fusionauth:java-http without recompiling the library.
      - name: Download java-http JAR
        uses: actions/download-artifact@v4
        with:
          name: java-http-jar
          path: /tmp/java-http-artifact

      - name: Install java-http into local Maven repository
        run: |
          JAR="$(find /tmp/java-http-artifact -name 'java-http-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          test -n "${JAR}" -a -f "${JAR}"
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version -f pom.xml)"
          mvn -B --no-transfer-progress -q org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="${JAR}" \
            -DgroupId=io.fusionauth \
            -DartifactId=java-http \
            -Dversion="${VERSION}" \
            -Dpackaging=jar

      - name: Run load-test smoke benchmarks
        env:
          # Skip redundant parent install in the harness; artifact is already in ~/.m2.
          SKIP_JAVA_HTTP_INSTALL: 'true'
        run: |
          chmod +x load-tests/run-benchmarks.sh
          # Keep CI fast: self + jdk only, hello scenario, 5s duration.
          # Tomcat/Netty/Jetty remain available for local full runs.
          SHA_SHORT="${GITHUB_SHA:0:7}"
          ./load-tests/run-benchmarks.sh \
            --servers self,jdk-httpserver \
            --scenarios hello \
            --tool wrk \
            --duration 5s \
            --label "ci-smoke-${SHA_SHORT}"

      - name: Upload load-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-tests/results/
          retention-days: 7
          if-no-files-found: ignore
